name: Build IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: plei
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project Plei.xcodeproj -scheme Plei -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build.log
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Plei.app Payload/
          zip -r Plei.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Plei-ipa
          path: plei/Plei.ipa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: plei/build.log
